name: Build

# Manual only: run from the Actions tab ("Run workflow") on the branch/tag you want to build.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string embedded in the binary (default: git describe)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$(git describe --tags --always --dirty)}"
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          mkdir -p bin
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "bin/incott${EXT}" ./cmd/incott
          "./bin/incott${EXT}" --version
      - uses: actions/upload-artifact@v4
        with:
          name: incott-${{ runner.os }}-${{ runner.arch }}
          path: bin/
